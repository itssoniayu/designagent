<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sonia's Design Opportunities</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f5f5f7; color: #1d1d1f; }

  header { background: white; padding: 24px 32px; border-bottom: 1px solid #e5e5e5; position: sticky; top: 0; z-index: 10; }
  .header-top { display: flex; align-items: baseline; gap: 16px; margin-bottom: 16px; }
  h1 { font-size: 24px; font-weight: 700; }
  .subtitle { color: #6e6e73; font-size: 14px; }
  .stats { display: flex; gap: 24px; flex-wrap: wrap; }
  .stat { display: flex; align-items: center; gap: 8px; }
  .stat-num { font-size: 22px; font-weight: 700; }
  .stat-label { font-size: 13px; color: #6e6e73; }

  .filters { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
  .filter-btn { padding: 6px 16px; border-radius: 20px; border: 1px solid #d2d2d7; background: white; cursor: pointer; font-size: 13px; transition: all 0.15s; }
  .filter-btn:hover, .filter-btn.active { background: #1d1d1f; color: white; border-color: #1d1d1f; }

  main { max-width: 1100px; margin: 32px auto; padding: 0 24px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 20px; }

  .card { background: white; border-radius: 12px; overflow: hidden; box-shadow: 0 1px 4px rgba(0,0,0,0.08); transition: box-shadow 0.2s; }
  .card:hover { box-shadow: 0 4px 16px rgba(0,0,0,0.12); }
  .card.hidden { display: none; }

  .card-header { padding: 12px 16px; display: flex; justify-content: space-between; align-items: center; }
  .tag { font-size: 11px; font-weight: 600; color: white; padding: 3px 10px; border-radius: 20px; letter-spacing: 0.5px; }
  .date { font-size: 12px; color: #6e6e73; }

  .card-body { padding: 16px; }
  .card-body h3 { font-size: 15px; font-weight: 600; margin-bottom: 8px; line-height: 1.4; }
  .card-body h3 a { color: #1d1d1f; text-decoration: none; }
  .card-body h3 a:hover { color: #0071e3; }
  .desc { font-size: 13px; color: #6e6e73; line-height: 1.5; margin-bottom: 14px; }

  .meta { display: flex; flex-direction: column; gap: 8px; }
  .meta-item { display: flex; flex-direction: column; gap: 2px; }
  .meta-label { font-size: 11px; font-weight: 600; color: #999; text-transform: uppercase; letter-spacing: 0.5px; }
  .meta-value { font-size: 13px; color: #444; }
  .deadline { font-weight: 600; color: #d93025; }

  .card-footer { padding: 12px 16px; border-top: 1px solid #f0f0f0; }
  .apply-btn { display: inline-block; color: white; padding: 8px 18px; border-radius: 8px; text-decoration: none; font-size: 13px; font-weight: 500; }

  .empty { text-align: center; padding: 80px 32px; color: #6e6e73; grid-column: 1/-1; }
  .empty h3 { font-size: 20px; margin-bottom: 8px; color: #1d1d1f; }
  footer { text-align: center; padding: 32px; color: #999; font-size: 13px; }
</style>
</head>
<body>

<header>
  <div class="header-top">
    <h1>Design Opportunities</h1>
    <span class="subtitle" id="last-updated">Waiting for first search run...</span>
  </div>
  <div class="stats">
    <div class="stat"><span class="stat-num" style="color:#1a73e8;" id="count-internship">0</span><span class="stat-label">Internships</span></div>
    <div class="stat"><span class="stat-num" style="color:#7c3aed;" id="count-event">0</span><span class="stat-label">Events</span></div>
    <div class="stat"><span class="stat-num" style="color:#137333;" id="count-course">0</span><span class="stat-label">Courses</span></div>
  </div>
  <div class="filters">
    <button class="filter-btn active" onclick="filter('all', this)">All</button>
    <button class="filter-btn" onclick="filter('internship', this)">💼 Internships</button>
    <button class="filter-btn" onclick="filter('event', this)">📅 Events</button>
    <button class="filter-btn" onclick="filter('course', this)">📚 Courses</button>
  </div>
</header>

<main>
  <div class="grid" id="grid">
    <div class="empty">
      <h3>No opportunities yet</h3>
      <p>The agent will populate this dashboard on its first daily run.</p>
    </div>
  </div>
</main>

<footer>Searches run daily across LinkedIn, Handshake, company career sites, Google, and more · Built for Sonia Yu</footer>

<script>
  const TYPE_COLORS = {
    internship: { bg: "#e8f0fe", color: "#1a73e8", icon: "💼" },
    event:      { bg: "#f3e8ff", color: "#7c3aed", icon: "📅" },
    course:     { bg: "#e6f4ea", color: "#137333", icon: "📚" },
  };

  async function loadData() {
    try {
      const res = await fetch("../data/opportunities.json");
      const data = await res.json();
      renderDashboard(data);
    } catch (e) {
      console.log("No data yet:", e);
    }
  }

  function renderDashboard(data) {
    const opps = data.opportunities || [];
    if (!opps.length) return;

    const internships = opps.filter(o => o.type === "internship");
    const events = opps.filter(o => o.type === "event");
    const courses = opps.filter(o => o.type === "course");

    document.getElementById("count-internship").textContent = internships.length;
    document.getElementById("count-event").textContent = events.length;
    document.getElementById("count-course").textContent = courses.length;
    document.querySelector(".filter-btn").textContent = `All (${opps.length})`;

    if (data.last_updated) {
      const d = new Date(data.last_updated);
      document.getElementById("last-updated").textContent = "Last updated: " + d.toLocaleDateString("en-US", { month: "long", day: "numeric", year: "numeric" });
    }

    const sorted = [...opps].sort((a, b) => b.found_date.localeCompare(a.found_date));
    const grid = document.getElementById("grid");
    grid.innerHTML = sorted.map(card).join("");
  }

  function card(o) {
    const { bg, color, icon } = TYPE_COLORS[o.type] || { bg: "#f5f5f5", color: "#333", icon: "🔔" };
    return `
      <div class="card" data-type="${o.type}">
        <div class="card-header" style="background:${bg};">
          <span class="tag" style="background:${color};">${icon} ${o.type.toUpperCase()}</span>
          <span class="date">Found ${o.found_date || ""}</span>
        </div>
        <div class="card-body">
          <h3><a href="${o.url}" target="_blank">${o.title}</a></h3>
          <p class="desc">${(o.description || "").slice(0, 200)}...</p>
          <div class="meta">
            <div class="meta-item">
              <span class="meta-label">Deadline</span>
              <span class="meta-value deadline">${o.deadline || "Check website"}</span>
            </div>
            <div class="meta-item">
              <span class="meta-label">Requirements</span>
              <span class="meta-value">${(o.requirements || "See listing.").slice(0, 120)}</span>
            </div>
          </div>
        </div>
        <div class="card-footer">
          <a href="${o.url}" target="_blank" class="apply-btn" style="background:${color};">Apply / View →</a>
        </div>
      </div>`;
  }

  function filter(type, btn) {
    document.querySelectorAll(".filter-btn").forEach(b => b.classList.remove("active"));
    btn.classList.add("active");
    document.querySelectorAll(".card").forEach(card => {
      card.classList.toggle("hidden", type !== "all" && card.dataset.type !== type);
    });
  }

  loadData();
</script>
</body>
</html>
